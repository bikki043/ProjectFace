<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผู้ดูแลระบบ — เข้าสู่ระบบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(15, 23, 42, 0.88);
      --panel-border: rgba(148, 163, 184, 0.22);
      --ink: #edf3ff;
      --muted: #9aa7bb;
      --accent: #ffc857;
      --accent-strong: #f9b233;
      --danger: #ff6b6b;
      --shadow: 0 28px 60px rgba(1, 7, 18, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Noto Sans Thai', sans-serif;
      background: radial-gradient(circle at top, rgba(255, 200, 87, 0.18), transparent 30%), #06111d;
      color: var(--ink);
    }

    .login-shell {
      width: min(420px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: rgba(255, 200, 87, 0.18);
      color: var(--accent);
      font-size: 28px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.8);
      color: var(--ink);
      font-size: 16px;
      padding: 14px 15px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: rgba(255, 200, 87, 0.7);
      box-shadow: 0 0 0 3px rgba(255, 200, 87, 0.12);
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
      color: #0f172a;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 18px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .primary-btn:hover { filter: brightness(1.02); }
    .primary-btn:active { transform: translateY(1px); }
    .primary-btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .meta-row {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .meta-row a {
      color: var(--accent);
      text-decoration: none;
    }

    .error-message {
      min-height: 20px;
      margin-top: 14px;
      color: var(--danger);
      font-size: 13px;
    }
  </style>
  <link rel="stylesheet" href="/css/corporate.css">
</head>
<body class="admin-login">
  <div class="login-shell">
    <aside class="login-aside">
      <a class="login-brand" href="/user" aria-label="FaceGate">
        <span class="brand-mark" aria-hidden="true">FG</span>
        <span><strong>FaceGate</strong><small>ระบบบริหารงานบุคคล</small></span>
      </a>
      <p class="aside-caption">จัดการข้อมูลพนักงาน การลงเวลา และเงินเดือน</p>
      <div class="meta-row">
        <span>สำหรับพนักงาน</span>
        <a href="/user">ไปหน้าบันทึกเวลา</a>
      </div>
    </aside>

    <section class="login-content">
    <h1>เข้าสู่ระบบฝ่ายบุคคล</h1>
    <p class="subtitle">สำหรับผู้ดูแลระบบและทีมทรัพยากรบุคคล</p>

    <form id="admin-login-form" novalidate>
      <div class="field">
        <label for="employee-id">รหัสพนักงาน</label>
        <input id="employee-id" name="employee_id" type="text" autocomplete="username" placeholder="เช่น 001" required>
      </div>

      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <button class="primary-btn" id="login-btn" type="submit">เข้าสู่ระบบ</button>
      <div class="error-message" id="login-error" aria-live="polite"></div>
    </form>

    </section>
  </div>

  <script type="module" src="/js/admin-login.js"></script>
</body>
</html>
